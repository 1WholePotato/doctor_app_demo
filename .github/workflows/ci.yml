name: CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: doctor_website_demo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: doctor_website_demo/package-lock.json

      - run: npm ci

      - run: npx tsc -b

      - run: npm run lint
