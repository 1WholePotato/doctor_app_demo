name: Local database rebuild
on:
  pull_request:
    paths:
      - 'doctor_website_demo/supabase/**'
      - '.github/workflows/local-database.yml'

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: doctor_website_demo
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: '3.0.0'
      - run: supabase start
      - run: supabase db reset --local
      - name: Check synthetic booking and linked records
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          result="$(psql -XAt -v ON_ERROR_STOP=1 <<'SQL'
          select u.email, c.course_title, p.amount, cert.certificate_number
          from public.bookings b
          join public.users u on u.id = b.user_id
          join auth.users au on au.id = u.id
          join public.course_sessions cs on cs.id = b.course_session_id
          join public.courses c on c.id = cs.course_id
          join public.payments p on p.booking_id = b.id
          join public.certificates cert on cert.booking_id = b.id;
          SQL
          )"
          test "$result" = 'student@example.test|Fixture Clinical Skills|100.00|FIXTURE-B01-001'
      - name: Test booking, class instructor, class administration, material fee, seat reservation, payment attempt and payment settlement constraints
        run: supabase test db
      - name: Race bookings against class capacity changes, seat reservations, payment attempts and payment settlement
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          supabase/checks/class_capacity_race.sh
          supabase/checks/seat_reservation_race.sh
          supabase/checks/payment_attempt_race.sh
          supabase/checks/payment_settle_race.sh
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Start Ozow payments through the checkout function against the mock
        run: |
          supabase functions serve --env-file supabase/functions/tests/ozow-mock.env > "$RUNNER_TEMP/functions.log" 2>&1 &
          for _ in $(seq 1 60); do grep -q 'Serving functions' "$RUNNER_TEMP/functions.log" && break; sleep 2; done
          cat "$RUNNER_TEMP/functions.log"
          eval "$(supabase status -o env | sed 's/^/export /')"
          cd supabase/functions
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" OZOW_MOCK_PORT=55590 \
            deno test --allow-net --allow-env tests/
      - name: Reconcile legacy bookings, class instructors, material fees and seat holds
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          supabase db reset --local --no-seed --version 20261117190000
          psql -XAq -v ON_ERROR_STOP=1 -f supabase/checks/legacy_bookings.sql
          psql -XAq -v ON_ERROR_STOP=1 -f supabase/checks/legacy_instructors.sql
          psql -XAq -v ON_ERROR_STOP=1 -f supabase/checks/legacy_material_types.sql
          supabase migration up --local
          supabase test db supabase/checks/legacy_reconciliation.test.sql
          supabase test db supabase/checks/legacy_session_instructors.test.sql
          supabase test db supabase/checks/legacy_material_fees.test.sql
          supabase test db supabase/checks/legacy_seat_holds.test.sql
      - name: Reconcile legacy inactive classes
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          supabase db reset --local --no-seed --version 20261118100000
          psql -XAq -v ON_ERROR_STOP=1 -f supabase/checks/legacy_classes.sql
          supabase migration up --local
          supabase test db supabase/checks/legacy_classes.test.sql
