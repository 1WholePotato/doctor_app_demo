name: Local database rebuild
on:
  pull_request:
    paths:
      - 'doctor_website_demo/supabase/**'
      - 'doctor_website_demo/scripts/test-registration-local.mjs'
      - 'doctor_website_demo/scripts/test-recovery-email-local.mjs'
      - '.github/workflows/local-database.yml'

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: doctor_website_demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: doctor_website_demo/package-lock.json
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: '3.0.0'
      - run: supabase start
      - run: supabase db reset --local
      - name: Check synthetic booking and linked records
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          result="$(psql -XAt -v ON_ERROR_STOP=1 <<'SQL'
          select u.email, c.course_title, p.amount, cert.certificate_number
          from public.bookings b
          join public.users u on u.id = b.user_id
          join auth.users au on au.id = u.id
          join public.courses c on c.id = b.course_session_id
          join public.payments p on p.booking_id = b.id
          join public.certificates cert on cert.booking_id = b.id;
          SQL
          )"
          test "$result" = 'student@example.test|Fixture Clinical Skills|100.00|FIXTURE-B01-001'
      - run: supabase test db
      - name: Register students with an immediate session
        run: |
          set -a
          eval "$(supabase status -o env | grep -E '^[A-Z_]+=')"
          set +a
          EXPECT_EMAIL_CONFIRMATION=false node --test scripts/test-registration-local.mjs
      - name: Recover passwords and change emails through Auth links
        run: |
          set -a
          eval "$(supabase status -o env | grep -E '^[A-Z_]+=')"
          set +a
          node --test scripts/test-recovery-email-local.mjs
      - name: Register students with email confirmation
        run: |
          supabase stop
          SUPABASE_AUTH_EMAIL_ENABLE_CONFIRMATIONS=true supabase start
          set -a
          eval "$(supabase status -o env | grep -E '^[A-Z_]+=')"
          set +a
          EXPECT_EMAIL_CONFIRMATION=true node --test scripts/test-registration-local.mjs
